<!doctype html>
<html lang="en" data-mode="desk" data-device="desk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/notify-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Desk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Office GIF reminders for lunch, meetings, and time to leave — with a Nightstand mode for later."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Desk — GIF reminders</title>
    <script>
      try {
        const mode = localStorage.getItem('nightstand.mode')
        if (mode === 'desk' || mode === 'nightstand') {
          document.documentElement.dataset.mode = mode
        }
        const requested = new URLSearchParams(location.search).get('device')
        const ua = navigator.userAgent || ''
        const uaMobile = navigator.userAgentData && navigator.userAgentData.mobile
        const native =
          window.Capacitor &&
          window.Capacitor.isNativePlatform &&
          window.Capacitor.isNativePlatform()
        const phone =
          requested === 'phone'
            ? true
            : requested === 'desk'
              ? false
              : native
                ? true
                : typeof uaMobile === 'boolean'
                ? uaMobile
                : /iPhone|iPod|Windows Phone|IEMobile|webOS|BlackBerry/i.test(ua) ||
                  /Android.+Mobile/i.test(ua)
        document.documentElement.dataset.device = phone ? 'phone' : 'desk'
      } catch (error) {
        // Keep the HTML default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
