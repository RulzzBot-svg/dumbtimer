<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desk ping</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120e18;
        color: #f4ead8;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      button {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: inherit;
        color: inherit;
        cursor: pointer;
      }
      img {
        width: 100%;
        flex: 1;
        object-fit: cover;
        background: #1c1626;
      }
      p {
        margin: 0;
        padding: 14px 16px 18px;
        text-align: left;
      }
      strong {
        display: block;
        font-size: 16px;
      }
      span {
        color: #d9cbb3;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <button type="button" id="open">
      <img id="gif" alt="" />
      <p>
        <strong id="title">Desk ping</strong>
        <span id="time"></span>
      </p>
    </button>
    <script src="ping.js"></script>
  </body>
</html>
