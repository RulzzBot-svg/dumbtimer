<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desk ping</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        background: #120e18;
        color: #f4ead8;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        display: flex;
        width: 1280px;
        height: 800px;
        align-items: center;
        justify-content: center;
      }
      .phone {
        display: flex;
        width: 380px;
        height: 520px;
        flex-direction: column;
        overflow: hidden;
        border-radius: 24px;
        background: #1c1626;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      img {
        width: 100%;
        height: 380px;
        object-fit: cover;
        background: #1c1626;
      }
      p {
        margin: 0;
        padding: 18px 20px 22px;
      }
      strong {
        display: block;
        font-size: 18px;
      }
      span {
        color: #d9cbb3;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <img
          src="ping-still.jpg"
          alt="GIF ping"
        />
        <p>
          <strong>time to leave work</strong>
          <span>Desk · 17:00 · click to open</span>
        </p>
      </div>
    </div>
  </body>
</html>
