<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desk account</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        background: #f3eee4;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: #1c1915;
      }
      .wrap {
        display: grid;
        place-items: center;
        width: 1280px;
        height: 800px;
      }
      .card {
        width: 420px;
        padding: 28px;
        border-radius: 28px;
        background: #fffcf6;
        box-shadow: 0 24px 60px rgba(28, 25, 21, 0.16);
      }
      .kicker {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c24e24;
      }
      h1 {
        margin: 8px 0 12px;
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 600;
      }
      .muted {
        margin: 0 0 18px;
        color: #6f675c;
        font-size: 14px;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6f675c;
      }
      .field {
        height: 44px;
        margin: 0 0 14px;
        padding: 0 12px;
        border: 1px solid rgba(28, 25, 21, 0.12);
        border-radius: 16px;
        background: #f3eee4;
        line-height: 44px;
        color: #6f675c;
      }
      .primary {
        display: grid;
        height: 44px;
        place-items: center;
        border-radius: 16px;
        background: #1c1915;
        color: #f3eee4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <p class="kicker">Account</p>
        <h1>Log in</h1>
        <p class="muted">
          No email, no verification. Pick a username and a password so you can
          save templates and send them to a friend.
        </p>
        <label>Username</label>
        <div class="field">Rulz</div>
        <label>Password</label>
        <div class="field">•••••••••</div>
        <div class="primary">Log in</div>
      </div>
    </div>
  </body>
</html>
